[project]
name = "paralang"
version = "0.2.0"
description = "Paralinguistic cues (pauses, pace, pitch, loudness) for voice agents"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
acoustic = ["opensmile>=2.5"]          # pitch / loudness / jitter / shimmer / HNR
pipecat = ["pipecat-ai>=1.12", "loguru"]
say = ["edge-tts>=7.3.1"]                 # free emotional TTS CLI (python -m paralang.say), needs ffmpeg
dev = ["pytest>=8", "opensmile>=2.5"]

[project.scripts]
paralang-offline = "paralang.adapters.offline:main"
paralang-say = "paralang.say:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["paralang*"]
